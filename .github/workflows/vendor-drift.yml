# The READER for the vendored `fixed` tree.
#
# extern/fixed/ is generated by tools/revendor-fixed.sh from a pinned commit. Without
# something that actually compares the two, a hand edit to the vendored copy keeps
# compiling and keeps passing every other test -- it just quietly stops matching the
# library it claims to be. A generated copy with no reader is a copy with extra steps.
name: vendor drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fixed:
    name: extern/fixed matches its pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check extern/fixed against the pinned commit
        run: tools/revendor-fixed.sh --check

      - name: Check NOTES.md records the same pin
        # The pin lives in two places by necessity -- the script executes it, the notes
        # document it -- so the two can disagree. This is the cheapest possible guard
        # against a re-vendor that moves the code and leaves the documentation lying.
        run: |
          set -euo pipefail
          script_pin="$(grep -oE '^FIXED_PIN="[0-9a-f]{40}"' tools/revendor-fixed.sh | grep -oE '[0-9a-f]{40}')"
          notes_pin="$(grep -oE '[0-9a-f]{40}' extern/fixed/NOTES.md | head -1)"
          echo "script: $script_pin"
          echo "notes : $notes_pin"
          if [ "$script_pin" != "$notes_pin" ]; then
            echo "::error::tools/revendor-fixed.sh and extern/fixed/NOTES.md disagree about the pinned commit"
            exit 1
          fi
