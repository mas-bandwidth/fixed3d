\* Mutant: UpdatePairs drops the moved-bit clear (DropClear = TRUE).
\* TLC must violate MovedClearedAfterUpdate. All other invariants are
\* still checked, so the failure is pinned to the dropped clear.
SPECIFICATION Spec
CONSTANTS
    MaxSteps = 6
    DropClear = TRUE
    NodeBytes = 72
INVARIANTS
    TypeOK
    RootMarkConsistent
    PairCompleteness
    NoDestroyedProxyInPairs
    SortedDuplicateFree
    MovedClearedAfterUpdate
    RebuildPreservesPairs
    SentinelNeverOverlaps
    EmittedPairsAreOverlaps
