\* Mutant: ClearMoved FALSE drops the static clear in UpdatePairs and the
\* dynamic clear in RebuildStale. MovedBitsClearedAsSpecified fails.
\* Same instance as BroadPhaseTree.cfg. Not a C test.
SPECIFICATION Spec
CONSTANTS
  P1 = P1
  P2 = P2
  P3 = P3
  Static = Static
  Dynamic = Dynamic
  Narrow = Narrow
  Ludicrous = Ludicrous
  MaxActions = 8
  ClearMoved = FALSE
  Layouts = {Narrow, Ludicrous}
INVARIANTS
  TypeOK
  TreeAgrees
  MoveBufferAgrees
  NewEligibleEmittedOnce
  NoPairOfDestroyedProxy
  PairKeysTotallyOrdered
  EmittedSorted
  MovedBitsClearedAsSpecified
  SentinelNeverOverlaps
  DisjointPairsDropped
  LiveMovedConsidered
  LayoutIsAbstractLabel
