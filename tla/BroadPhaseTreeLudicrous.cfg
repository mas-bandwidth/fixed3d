\* Same instance as BroadPhaseTree.cfg, Ludicrous layout only.
\* Distinct-state count must match BroadPhaseTreeNarrow.cfg.
\* Not a C test.
SPECIFICATION Spec
CONSTANTS
  P1 = P1
  P2 = P2
  P3 = P3
  Static = Static
  Dynamic = Dynamic
  Narrow = Narrow
  Ludicrous = Ludicrous
  MaxActions = 8
  ClearMoved = TRUE
  Layouts = {Ludicrous}
INVARIANTS
  TypeOK
  TreeAgrees
  MoveBufferAgrees
  NewEligibleEmittedOnce
  NoPairOfDestroyedProxy
  PairKeysTotallyOrdered
  EmittedSorted
  MovedBitsClearedAsSpecified
  SentinelNeverOverlaps
  DisjointPairsDropped
  LiveMovedConsidered
  LayoutIsAbstractLabel
